services:
  # ── 1. React 19 Frontend PWA ───────────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: cropx_frontend
    restart: unless-stopped
    networks:
      - cropx_net

  # ── 2. Node.js Backend API Gateway ─────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cropx_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      ADVISORY_ENGINE_URL: http://advisory-engine:8001
      DISTRESS_ENGINE_URL: http://distress-engine:8002
    env_file:
      - path: ./server/.env
        required: true
    depends_on:
      - advisory-engine
      - distress-engine
    networks:
      - cropx_net

  # ── 3. Advisory Engine (HC) ────────────────────────────────────────────────
  advisory-engine:
    build:
      context: ./ml-services/advisory-engine
      dockerfile: Dockerfile
    container_name: cropx_advisory_engine
    restart: unless-stopped
    environment:
      PORT: 8001
    networks:
      - cropx_net

  # ── 4. Distress Engine (KT) ────────────────────────────────────────────────
  distress-engine:
    build:
      context: ./ml-services/distress-engine
      dockerfile: Dockerfile
    container_name: cropx_distress_engine
    restart: unless-stopped
    environment:
      PORT: 8002
    networks:
      - cropx_net

  # ── 5. Production Nginx SSL Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cropx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cropx_net

  # ── 6. Automated Certbot SSL Renewal ───────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: cropx_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - cropx_net

networks:
  cropx_net:
    driver: bridge
