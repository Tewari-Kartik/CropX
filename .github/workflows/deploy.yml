name: CropX Continuous Deployment (AWS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ── 1. Quality & Build Checks ───────────────────────────────────────────────
  validate-and-build:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Test Client Build
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Distress Engine (KT)
        working-directory: ./ml-services/distress-engine
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -v

      - name: Test Advisory Engine (HC)
        working-directory: ./ml-services/advisory-engine
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -v

  # ── 2. Native OpenSSH Deployment to AWS EC2 ─────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via Native SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME || 'cropx.click' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@cropx.click' }}
        run: |
          set -euo pipefail

          # 1. Prepare SSH key and known_hosts
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 2. Transfer and execute deployment commands on AWS EC2
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "bash -s" << 'EOF'
            set -euxo pipefail
            DEPLOY_DIR="/opt/cropx"

            # Clone repository if missing, or update
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "Cloning repository to $DEPLOY_DIR..."
              sudo git clone https://github.com/Tewari-Kartik/CropX.git "$DEPLOY_DIR"
              sudo chown -R $(whoami):$(whoami) "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main

            # Write environment variables
            mkdir -p server
            cat << 'ENVEOF' > server/.env
          EOF

          # Inject the SERVER_ENV safely
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "cat << 'ENVEOF' > /opt/cropx/server/.env
$SERVER_ENV
ENVEOF"

          # Run containers and healthcheck
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "bash -s" << 'EOF'
            set -euxo pipefail
            cd /opt/cropx

            chmod +x init-ssl.sh
            ./init-ssl.sh "cropx.click" "admin@cropx.click" 0 || true

            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            docker image prune -f
            docker compose -f docker-compose.prod.yml ps

            echo "=== Deployment to AWS Succeeded! ==="
          EOF
