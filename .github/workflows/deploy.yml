name: CropX Continuous Deployment (AWS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ── 1. Quality & Build Checks ───────────────────────────────────────────────
  validate-and-build:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Test Client Build
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Distress Engine (KT)
        working-directory: ./ml-services/distress-engine
        run: |
          pip install -r requirements.txt
          pytest tests/ -v

      - name: Test Advisory Engine (HC)
        working-directory: ./ml-services/advisory-engine
        run: |
          pip install -r requirements.txt
          pytest tests/ -v

  # ── 2. Deploy to AWS EC2 ───────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euxo pipefail

            DEPLOY_DIR="/opt/cropx"

            # 1. Clone repository if not present, otherwise pull latest main
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "Cloning repository..."
              sudo git clone https://github.com/Tewari-Kartik/CropX.git "$DEPLOY_DIR"
              sudo chown -R ubuntu:ubuntu "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main

            # 2. Inject production .env for backend
            mkdir -p server
            echo "${{ secrets.SERVER_ENV }}" > server/.env

            # 3. Build & launch production containers
            chmod +x init-ssl.sh
            ./init-ssl.sh "${{ secrets.DOMAIN_NAME || 'cropx.click' }}" "${{ secrets.ADMIN_EMAIL || 'admin@cropx.click' }}" 0 || true

            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # 4. Clean up unused images to save disk space
            docker image prune -f

            # 5. Verify running status
            docker compose -f docker-compose.prod.yml ps
            echo "=== Deployment to AWS Succeeded! ==="
